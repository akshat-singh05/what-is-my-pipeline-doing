name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt
    - run: pip install -r requirements.txt
    - run: ruff check ir/ parsers/ tests/ generators/ tool1/ tool2/ llm/ evaluation/
        cli.py scripts/
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt
    - run: pip install -r requirements.txt
    - run: pytest tests/ -m "not slow"
